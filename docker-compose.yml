services:

  # ── Flask dashboard ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    # Host networking lets containers reach SimSat (:9005) and
    # llama-server (:8080) running on the host.
    network_mode: host
    working_dir: /workspace/mission_control
    command: python app.py
    volumes:
      - state:/workspace/mission_control
    restart: unless-stopped

  # ── Data collection / inference loop ─────────────────────────────────────────
  collector:
    build:
      context: .
      dockerfile: Dockerfile.app
    network_mode: host
    working_dir: /workspace
    command: python collect_data.py
    volumes:
      - state:/workspace/mission_control
      - ./data:/workspace/data
    restart: unless-stopped

volumes:
  # Ephemeral shared memory between app and collector.
  # Resets on docker-compose down -v
  state:
